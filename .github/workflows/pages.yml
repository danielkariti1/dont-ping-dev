name: Test and deploy the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate the game files
        run: node --test tests/*.test.mjs

      - name: Prepare the public site
        run: node tests/build-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
